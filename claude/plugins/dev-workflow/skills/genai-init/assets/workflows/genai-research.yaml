# Research. The file name is the workflow name.
# Installed by genai-init - do not hand-edit; change the source and install again.
nodes:
  - genai.research-brief
  - genai.research-plan
  - genai.research-probe
  - genai.research-synth
  - genai.research-review

defaults:
  # Wider than the development flow: a question that needs reshaping is normal here, not a symptom.
  patience: 3
