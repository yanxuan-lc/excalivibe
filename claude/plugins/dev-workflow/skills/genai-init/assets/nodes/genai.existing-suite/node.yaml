id: genai.existing-suite
kind: verify
executor:
  protocol: main

inputs:
  - name: code
    from: genai.implement

outputs:
  - name: report
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/suite-report.md
    signature: checksum

gates:
  # Ordered first on purpose: a result describing earlier code must be rejected as stale even
  # though the file is present and says it completed.
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: ran_against
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the code has changed since this suite ran, so the recorded result describes a version that no longer exists
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the suite result is not on disk - the suite has not been run, which is not the same as it having passed
  - rule_id: outcome
    checker:
      type: report
      field: outcome
    on_result:
      completed:
        verdict: pass
        state:
          ran_against: "{{inputs.code}}"
      partial:
        verdict: reject
        message: the suite did not finish - a partial run says nothing about the cases it never reached
      failed:
        verdict: reject
        message: the suite ran and failed - fix the code, then re-run and re-record
      blocked:
        verdict: delegate
        message: the suite could not be run at all - resolve what is blocking it before treating this as a code problem
