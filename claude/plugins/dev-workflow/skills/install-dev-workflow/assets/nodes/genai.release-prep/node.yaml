id: genai.release-prep
kind: produce
executor:
  protocol: subagent
  params:
    name: release-coordinator

inputs:
  - name: roster
    from: genai.changes
  - name: acceptance
    from: genai.e2e-run

outputs:
  - name: dossier
    kind: file
    locator: genai/sprints/{{vars.sprint}}/delivery.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the release dossier is not on disk
