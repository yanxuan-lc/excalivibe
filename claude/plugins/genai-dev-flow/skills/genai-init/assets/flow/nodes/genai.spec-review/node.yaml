id: genai.spec-review
kind: judge
description: optional - nothing downstream consumes this verdict. Leave it out for a small batch on ground the project has covered before; keep it where a design error would be found late and cost a rewrite

executor:
  protocol: subagent
  params:
    name: genai-spec-reviewer

inputs:
  - name: changes
    from: genai.spec
    required: true

# One record per change, next to the change it judges, so it travels into the archive with it.
# The name is deliberately not `review.md`: that one belongs to genai.code-review, and the two
# judge different things at different times. A reader finding both in one directory can tell
# which is which without opening them.
outputs:
  - name: spec-reviews
    kind: glob
    locator: openspec/changes/*/spec-review.md
    signature: checksum

# No entry rule. The required input from genai.spec already asserts the only precondition there
# is — that something was designed — and a second rule reading the same fact off disk would just
# be a slower copy of it.

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: "No design review landed. Write one spec-review.md under each change directory"

  # A judge report is the only place a model's judgement legitimately enters a gate.
  - rule_id: verdict
    checker: { type: report, field: verdict }
    on_result:
      approve: { verdict: pass }
      conditional:
        verdict: reject
        message: "Approved-with-conditions is not approved. A design condition is a design change — make it in the spec, not later in the code. The conditions themselves are in openspec/changes/*/spec-review.md; this message is not a substitute for reading them"
      reject:
        verdict: reject
        message: "Read openspec/changes/*/spec-review.md and fix the spec, then have it reviewed again — this is the cheapest point in the round to change the design"
