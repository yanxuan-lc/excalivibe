id: genai.implement
kind: produce
description: required - the only step that writes code, and the sole source of the commits that genai.code-review, genai.e2e and genai.merge each measure. What is worth knowing when picking the shape is its entry - it refuses while a human ruling on record no longer describes the current spec, so genai.arch-decision belongs in the graph freshly ruled or not at all

executor:
  protocol: subagent
  params:
    name: genai-developer

inputs:
  - name: changes
    from: genai.spec
    required: true
  # The deltas under each change directory — the requirement text this step builds against, and the
  # subject of the second premise rule below. `changes` alone would not do: a proposal.md left
  # untouched while its delta is rewritten is the ordinary shape of a spec revision, not an exotic
  # one.
  - name: specs
    from: genai.spec
    required: true
  # Not material this step builds from — it never opens the decision document, which was trimmed
  # and diagrammed for a person and has lost the detail an implementer needs. It is here so the
  # premise rule below has a conclusion to measure, and so the human ruling is a thing this step
  # depends on rather than a thing that merely happened before it.
  - name: decision
    from: genai.arch-decision
    required: true

outputs:
  - name: commits
    kind: git_commit
    locator: "{{vars.branch}}"
    signature: commit_sha

  # The same work, measured at a second grain, and declared here for one reader: `review-still-valid`
  # at genai.merge premises the review against this rather than against the tip. A tip signature says
  # "some commit landed", and a round routinely lands commits the review's subject does not contain —
  # a test the acceptance author repaired on a delegation, a document the writer updated. Every one of
  # those used to invalidate an approval that was still true of every line it had read, and each
  # invalidation cost a full review round.
  #
  # Not a replacement for `commits`, which stays exactly as it was: genai.e2e is premised against the
  # tip and should be, because a repaired test changes what the acceptance run would execute. The two
  # grains answer two different questions and both are asked.
  #
  # `check.mjs signature-product` says what it covers and the one project shape it cannot narrow.
  - name: product
    kind: observed
    signature:
      scheme: custom
      name: product_code
      command: node .flow/genai/check.mjs signature-product

# No rule here asserts anything this step changes. A clean-worktree rule would deadlock against the
# very artifact that makes the tree dirty, and is left out for that reason.
ready:
  # of is whose conclusion; against is what that conclusion was about. A person approved a
  # structure, and this is where that approval stops applying if the structure moved afterwards —
  # the same shape genai.merge uses twice to keep a review from covering commits it never saw.
  #
  # This is what makes the human step load-bearing rather than ceremonial. Without it, a spec
  # revised after the ruling would be built anyway, and the approval on record would describe a
  # design nobody implemented.
  #
  # It takes two rules because a premise is measured against one thing at a time, and a spec
  # revision can move two: the proposals, and the deltas underneath them. Both read the same
  # ruling; splitting them is what lets the refusal say which half moved. `genai.arch-decision`
  # declares both as inputs for no other purpose than to be measurable here — a premise against
  # something the upstream step never read is not false, it is unanswerable, and an unanswerable
  # premise refuses entry every time it is asked.
  #
  # **`absent` is ready, and it is the one branch here that is a policy rather than a fact.** It
  # means this graph holds no ruling step at all, which is how a round says it has no structural
  # choice to put in front of a person — a bug fix, a wording change, a field on a settled
  # interface. There is then no conclusion to keep fresh, and nothing for this rule to protect.
  # Every other not-fresh branch refuses: `unknown` is a ruling that has not happened yet and will,
  # `unread` is a definition bug, `stale` is an approval that no longer describes the spec. Only
  # "the round deliberately did not plan on one" lets the work through, and that choice is made once,
  # in the open, when the graph is submitted — `fsx graph create` prints which premises will fall to
  # `absent` and which way each is routed.
  #
  # **`stale` delegates rather than refuses**, over the graph's `implement -> write-arch-docs` edge.
  # Both rules here route to that one destination, so the edge needs no `rule_id` narrowing — unlike
  # the pair at genai.merge, which sends its two rules to two different steps. The chain closes over
  # edges that already exist: the document step re-derives the decision document from the current
  # spec, its `pass` edge re-activates genai.arch-decision, a person rules on what is actually there
  # now, and its `pass` edge brings the work back here with the premise fresh.
  #
  # Delegating to genai.arch-decision directly would be the shorter edge and the wrong one: it would
  # ask a person to re-approve a document that was written from the spec as it used to be. The
  # refusal message this replaces already said "have the decision document written again from the
  # current spec" — the edge now does it instead of asking someone to.
  #
  # The fixed point holds: genai.write-arch-docs writes `openspec/changes/*/genai/DECISION.mdx`,
  # which is in neither `changes` (the proposals) nor `specs` (the deltas), so re-running it does not
  # move either thing this rule compares.
  - rule_id: decision-still-valid
    checker:
      type: upstream_premise
      of: [decision]
      against: changes
    on_result:
      fresh: { verdict: pass }
      absent: { verdict: pass }
      stale:
        verdict: delegate
        message: "A proposal moved after it was approved. Write the decision document again from the current spec — an approval describes the design it was given and no other, and the ruling that follows will be taken on what is there now"
      unread:
        verdict: reject
        reason: "The ruling on record never read the spec, so it cannot say which version it approved. That is a bug in the installed step definitions, not in this round — genai.arch-decision has to declare `changes` and `specs` as its own inputs"
      unknown:
        verdict: reject
        reason: "The ruling step is in this graph but has not run yet. Let genai.arch-decision be dispatched and approved first"

  # Not a duplicate of the rule above, and the one that catches the common case: the deltas are what
  # implementation reads, and a requirement rewritten there while proposal.md stays put is invisible
  # to `changes`. That is the revision this flow expects to see most — it is where a review comment
  # lands.
  - rule_id: decision-covers-deltas
    checker:
      type: upstream_premise
      of: [decision]
      against: specs
    on_result:
      fresh: { verdict: pass }
      # Same policy as the rule above, for the same reason. The two must agree: routing one to pass
      # and the other to reject would leave a round that dropped the ruling step blocked by
      # whichever one refuses, with nothing in the graph able to satisfy it.
      absent: { verdict: pass }
      stale:
        verdict: delegate
        message: "A spec delta moved after the structure was approved. The ruling describes the requirements it was given — write the decision document again from the current deltas, and the ruling that follows will be taken on those"
      unread:
        verdict: reject
        reason: "The ruling on record never read the spec deltas, so it cannot say which version it approved. That is a bug in the installed step definitions — genai.arch-decision has to declare `specs` as its own input"
      unknown:
        verdict: reject
        reason: "The ruling step is in this graph but has not run yet. Let genai.arch-decision be dispatched and approved first"

  - rule_id: has-spec-deltas
    checker:
      type: command
      command: node .flow/genai/check.mjs spec-deltas
      label_from: result
      values: [present, absent, unreadable]
    on_result:
      present: { verdict: pass }
      absent:
        verdict: reject
        reason: "There is no spec delta under openspec/changes/ to build from. The design step either did not run or its output is gone"
      unreadable:
        verdict: reject
        reason: "openspec/changes/ could not be read — confirm openspec/ exists in this repository"
      failed:
        verdict: reject
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: "Nothing is committed on the branch. Uncommitted work cannot be measured"

  - rule_id: no-spin
    checker: { type: signature_changed }
    on_result:
      satisfied: { verdict: pass }
      stalled:
        verdict: reject
        message: "The branch tip has not moved. There is no new commit this round"

  # The two rules above have a hole between them that only shows on a first attempt, and it was
  # measured rather than reasoned about: `outputs` asks whether the branch has a tip, which it has had
  # since the install committed the baseline, and `signature_changed` compares this attempt to the
  # previous one, of which there is none. So an attempt that committed nothing at all passed both.
  # In the full graph the code review would catch it; in a graph without one, nothing did.
  #
  # This asks git the question the brief already puts to the executor — "every round must produce at
  # least one new commit" — by comparing the branch against the nearest branch it grew from. See
  # `round-commits` in check.mjs for why the baseline is derived and why an unreadable shape passes.
  - rule_id: round-committed
    checker:
      type: command
      command: node .flow/genai/check.mjs round-commits
      label_from: result
      values: [ahead, not_ahead, no_baseline, unreadable]
    on_result:
      ahead: { verdict: pass }
      no_baseline: { verdict: pass }
      not_ahead:
        verdict: reject
        message: "This branch carries nothing the branch it grew from does not already have — no commit landed this round. Uncommitted work cannot be measured, and a report that says otherwise is describing work nobody can see"
      unreadable:
        verdict: reject
        message: "git could not be read, so whether anything landed cannot be established. A setup problem — confirm this is a repository"
      failed:
        verdict: reject
        message: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

  - rule_id: outcome
    checker: { type: report, field: outcome }
    on_result:
      completed: { verdict: pass }
      partial:
        verdict: reject
        message: "Some changes are unfinished. Say which"
      failed:
        verdict: reject
        message: "Say what failed"
      blocked:
        verdict: reject
        message: "Say what blocked it"

  # The project reports; this gate judges. `make genai-metrics` prints the numbers its own suite
  # produced — it never says pass or fail, because a project that decides its own verdict has no
  # gate. The judgement ships with these definitions, so a round cannot loosen what it is
  # measured by. Only the coverage floors belong to the project, in a file the round may not edit
  # either. See .flow/genai/lib/metrics.mjs for the protocol in full.
  #
  # Every label lands in the event log together with the numbers behind it, so a rejection here
  # is reconstructible months later.
  - rule_id: checks
    checker:
      type: command
      command: node .flow/genai/check.mjs metrics
      timeout_ms: 600000
      label_from: result
      values:
        - satisfied
        - tests_failing
        - no_tests
        - too_many_skipped
        - coverage_below_floor
        - metrics_missing
        - metrics_unreadable
        - thresholds_missing
    on_result:
      satisfied: { verdict: pass }

      # Four ways the code is not good enough yet. These are the round's to fix.
      tests_failing:
        verdict: reject
        message: "Tests are failing. The counts are in the gate facts — fix the code, and do not delete or skip a test to get past this"
      no_tests:
        verdict: reject
        message: "No tests ran where the floors say they should. Either nothing ran at all, or a module with declared floors reported none — the gate facts say which. Work that adds behaviour adds a test that would fail without it"
      too_many_skipped:
        verdict: reject
        message: "More than a tenth of the suite is skipped. A skipped test is not a passing test — unskip them or stop counting them"
      coverage_below_floor:
        verdict: reject
        message: "Coverage is below a floor this project declared. The gate facts name the module, the dimension, the floor and what was measured — cover what this round changed in that module"

      # Three ways the setup is broken. The round is allowed to fix none of them, so retrying
      # cannot help — say so plainly and let the suspension hand it to a person.
      metrics_missing:
        verdict: reject
        message: "`make genai-metrics` produced no `genai-metrics:` line, so no numbers reached the gate. Either the target does not exist or it never printed. Setup problem — stop and hand it to a person"
      metrics_unreadable:
        verdict: reject
        message: "The metrics line came through but does not satisfy the protocol; the gate facts say which field and what was found. Setup problem"
      thresholds_missing:
        verdict: reject
        message: "tools/genai/thresholds.json is missing or unreadable, so the gate has no floors to judge against. Setup problem"

      # The evaluator itself, which ships with these definitions.
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions, not in the code under test"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # Separate from the metrics gate above, and it earns its place in a way that is easy to miss in a
  # single-language repository: there, running the suite compiles the code, so a build gate would be
  # a slower copy of `checks`. In a repository of several modules it is not. A module with no tests
  # is never compiled by the suite, and it does not trip `no_tests` either — the other modules
  # already satisfy "at least one test ran" — so its code can stop compiling and every gate here
  # stays green. This is the gate that notices, and it is also the only one that sees a contract
  # changed on one side of a language boundary and not the other.
  - rule_id: build
    checker:
      type: command
      command: node .flow/genai/check.mjs build-ok
      timeout_ms: 900000
      label_from: result
      values: [built, build_failed, target_missing]
    on_result:
      built: { verdict: pass }
      build_failed:
        verdict: reject
        message: "The project does not build. What make printed before it stopped is in the gate facts — read that rather than working from this line. A compiler or type-check error is the round's to fix"
      target_missing:
        verdict: reject
        message: "Nothing proves the code still compiles — there is no `genai-build` target, or it still holds the placeholder recipe the install wrote, or it runs no command at all. The gate facts say which. Setup problem — stop and hand it to a person"
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions, not in the code under test"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"
