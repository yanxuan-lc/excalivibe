id: genai.intent-slice
kind: judge
executor:
  protocol: human
  params:
    channel: stdout
patience: null
unattended: suspend

inputs:
  - name: brief
    from: genai.brief

outputs:
  - name: decision
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/intent-slice.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the slice decision is not on disk
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve:
        verdict: pass
      reject:
        verdict: reject
        message: the slice was not accepted - reshape what this change covers and bring it back
      conditional:
        verdict: reject
        message: accepted with conditions - fold them into the slice before design work starts
