id: genai.spec-review
kind: judge
executor: arch-reviewer

inputs:
  - name: design
    from: genai.spec

outputs:
  - name: note
    kind: glob
    locator: openspec/changes/*/genai/spec-review.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: reviewed_design
      against: design
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the design has changed since it was reviewed, so the earlier conclusion no longer holds
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the review note is not on disk
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve:
        verdict: pass
        state:
          reviewed_design: "{{inputs.design}}"
      reject:
        verdict: reject
        message: the design was not approved - work through the note and change the design itself, not the code
      conditional:
        verdict: reject
        message: approved with conditions - clear the items marked blocking first
