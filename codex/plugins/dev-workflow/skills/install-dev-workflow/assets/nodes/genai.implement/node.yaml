id: genai.implement
kind: produce
executor: developer

inputs:
  - name: design
    from: genai.spec

outputs:
  - name: evidence
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/tdd-evidence.md
    signature: checksum
  - name: code
    kind: git_commit
    locator: HEAD
    signature: commit_sha

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the implementation evidence is not on disk
  - rule_id: progress
    checker:
      type: signature_changed
    on_result:
      satisfied:
        verdict: pass
      stalled:
        verdict: reject
        message: this round is byte-identical to the last one, so the feedback was never acted on
