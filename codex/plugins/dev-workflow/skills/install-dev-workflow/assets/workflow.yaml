# The excalivibe development flow. Installed by install-dev-workflow — do not hand-edit;
# change the source and install again.
nodes:
  - genai.brief
  - genai.spec
  - genai.review-doc
  - genai.spec-review
  - genai.arch-gate
  - genai.implement
  - genai.e2e-script
  - genai.e2e-run
  - genai.code-review
  - genai.a11y
  - genai.security
  - genai.perf
  - genai.diagnose
  - genai.release-prep

defaults:
  # Two rejections, then it goes to a person. Judging steps declare a wider quota themselves.
  patience: 2
