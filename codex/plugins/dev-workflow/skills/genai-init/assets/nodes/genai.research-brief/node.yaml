id: genai.research-brief
kind: produce
executor:
  protocol: main

outputs:
  - name: question
    kind: file
    locator: docs/research/{{vars.topic}}/QUESTION.md
    signature: checksum

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: the bounded question is not on disk - everything after this is measured against it
