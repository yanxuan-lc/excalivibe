id: genai.research-review
kind: judge
executor:
  protocol: human
  params:
    channel: stdout
patience: null
unattended: suspend

inputs:
  - name: report
    from: genai.research-synth

outputs:
  - name: decision
    kind: file
    locator: docs/research/{{vars.topic}}/DECISION.md
    signature: checksum

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: the decision is not on disk
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve: { verdict: pass }
      reject:
        verdict: reject
        message: this does not answer what was asked - reshape the question rather than rewriting the answer
      conditional:
        verdict: reject
        message: accepted with conditions - address them before this is acted on
