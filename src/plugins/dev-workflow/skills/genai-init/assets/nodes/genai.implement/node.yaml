id: genai.implement
kind: produce
executor:
  protocol: subagent
  params:
    name: developer

inputs:
  - name: design
    from: genai.spec
  # Only present when a rescue diagnosis was run for this change, which most are not. Declared so
  # the dispatch hands over its path and signature instead of leaving the developer to find it.
  - name: diagnosis
    from: genai.diagnose
    required: false

outputs:
  - name: evidence
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/tdd-evidence.md
    signature: checksum
  - name: code
    kind: git_commit
    locator: HEAD
    signature: commit_sha

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the implementation evidence is not on disk
  - rule_id: progress
    checker:
      type: signature_changed
    on_result:
      satisfied:
        verdict: pass
      stalled:
        verdict: reject
        message: this round is byte-identical to the last one, so the feedback was never acted on
  # {{CMD_CHECK_DIFF_BEGIN}}
  # Scoped checks: the changed packages plus their reverse dependencies. That expansion is the
  # project's own logic in its own task runner, which is why the command comes from the project and
  # not from here.
  - rule_id: scoped_checks
    checker:
      type: command
      command: "{{CMD_CHECK_DIFF}}"
    on_result:
      satisfied:
        verdict: pass
      failed:
        verdict: reject
        message: the scoped checks failed on this change - the command and its output are in the gate diagnostics
      unexecutable:
        verdict: delegate
        message: the scoped check command could not be run at all - that is an environment or configuration problem, not a code one
  # {{CMD_CHECK_DIFF_END}}
