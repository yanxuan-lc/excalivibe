id: genai.research-synth
kind: produce
executor:
  protocol: subagent
  params:
    name: researcher

inputs:
  - name: findings
    from: genai.research-probe

outputs:
  - name: report
    kind: file
    locator: docs/research/{{vars.topic}}/REPORT.mdx
    signature: checksum
  - name: proposal
    kind: file
    locator: docs/research/{{vars.topic}}/PROPOSAL.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: drawn_from
      against: findings
    on_result:
      matched: { verdict: pass }
      mismatched:
        verdict: reject
        message: the findings have changed since this was written, so the report describes a different body of evidence
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied:
        verdict: pass
        state:
          drawn_from: "{{inputs.findings}}"
      missing:
        verdict: reject
        message: the report or the proposal is not on disk
