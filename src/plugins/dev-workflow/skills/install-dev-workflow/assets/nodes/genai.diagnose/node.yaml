id: genai.diagnose
kind: produce
executor: debugger

outputs:
  - name: diagnosis
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/diagnosis.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the diagnosis is not on disk
