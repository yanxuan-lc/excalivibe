id: genai.spec
kind: produce
executor:
  protocol: subagent
  params:
    name: planner

inputs:
  - name: brief
    from: genai.brief
    required: false

outputs:
  - name: design
    kind: file
    locator: openspec/changes/{{vars.change}}/design.md
    signature: checksum
  - name: specs
    kind: glob
    locator: openspec/changes/{{vars.change}}/specs/**/*.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the design or the spec deltas are not on disk
  - rule_id: completeness
    checker:
      type: command
      command: "{{CHECK_SPEC}} --all"
    on_result:
      satisfied:
        verdict: pass
      failed:
        verdict: reject
        message: the completeness check failed - close each gap it reported; a section that does not apply still needs one written line saying so
      unexecutable:
        verdict: delegate
        message: the completeness check could not run (openspec missing, or not at the project root) - not something the author can fix
