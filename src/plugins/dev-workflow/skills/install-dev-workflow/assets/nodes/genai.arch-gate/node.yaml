id: genai.arch-gate
kind: judge
executor: human
patience: null
unattended: suspend

inputs:
  - name: review
    from: genai.review-doc

outputs:
  - name: decision
    kind: glob
    locator: openspec/changes/*/genai/arch-gate.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the decision is not on disk
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve:
        verdict: pass
      reject:
        verdict: reject
        message: the reviewer asked for design changes - fold the feedback into the design and regenerate
      conditional:
        verdict: reject
        message: approved with conditions - address them first
