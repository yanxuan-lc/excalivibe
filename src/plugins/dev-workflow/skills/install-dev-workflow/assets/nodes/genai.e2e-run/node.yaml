id: genai.e2e-run
kind: verify
executor: e2e-runner

inputs:
  - name: code
    from: genai.implement
  - name: manifest
    from: genai.e2e-script
    required: false

outputs:
  - name: report
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/e2e-report.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: ran_against
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the code has changed since this ran, so the earlier acceptance result no longer holds
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the acceptance report is not on disk
  - rule_id: outcome
    checker:
      type: report
      field: outcome
    on_result:
      completed:
        verdict: pass
        state:
          ran_against: "{{inputs.code}}"
      partial:
        verdict: reject
        message: some scenarios failed or went uncovered - work through the report
      failed:
        verdict: reject
        message: acceptance failed - work through the report
      blocked:
        verdict: delegate
        message: the application would not start, or the environment is not available - not something the implementation can fix
