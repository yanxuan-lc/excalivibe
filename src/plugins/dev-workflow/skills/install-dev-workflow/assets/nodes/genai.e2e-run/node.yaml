id: genai.e2e-run
kind: verify
executor:
  protocol: subagent
  params:
    name: e2e-runner

# The acceptance material is authored per change, but it is executed here, once, against the
# integrated tree. The manifest is therefore NOT declared as an input: it is produced by a
# per-change step, and declaring it would make every batch graph demand a `change` value that a
# batch cannot give. The roster names the change directories to collect manifests from.
inputs:
  - name: tree
    from: genai.integrate

outputs:
  - name: acceptance
    kind: file
    locator: genai/sprints/{{vars.sprint}}/e2e-report.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: ran_against
      against: tree
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the integrated tree has moved since acceptance ran, so the earlier result describes a commit that will not ship
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the acceptance report is not on disk
  - rule_id: outcome
    checker:
      type: report
      field: outcome
    on_result:
      completed:
        verdict: pass
        state:
          ran_against: "{{inputs.tree}}"
      partial:
        verdict: reject
        message: some scenarios failed or went uncovered - work through the report
      failed:
        verdict: reject
        message: acceptance failed on the integrated tree - work through the report
      blocked:
        verdict: delegate
        message: the application would not start, or the environment is not available - not something the batch can fix
