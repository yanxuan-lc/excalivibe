# The whitelist of steps a genai-sprint graph may reference. Anything outside it is refused at
# graph creation, so "what can this kind of work do" has a definite answer.
nodes:
  - genai.spec
  - genai.implement
  - genai.code-review
  - genai.merge
  - genai.archive
  - genai.accept
  - genai.release

defaults:
  # Seven nodes, one value — so it is declared once here rather than seven times in the definitions.
  # This is a starting number to tune against real runs, not a derived one. Patience is shared
  # across the whole batch now that implement and review are not split per change, so a round
  # that reworks three changes once each spends three of it.
  patience: 5
