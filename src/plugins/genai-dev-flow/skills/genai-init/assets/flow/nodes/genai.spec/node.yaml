id: genai.spec
kind: produce
description: required - the round starts here. It is the only step that reads the requirements directory and claims a batch out of it, and every later step measures against the changes or the deltas it writes. Its entry is also where a round stops before it costs anything, on an empty backlog or a module map the Makefile no longer matches

executor:
  protocol: subagent
  params:
    name: genai-spec-writer

# Its input is the brief files in the sibling _genai directory, not an upstream node's
# artifact, so no inputs are declared. `inputs` expresses dependencies between nodes only.
outputs:
  - name: changes
    kind: glob
    locator: openspec/changes/*/proposal.md
    signature: checksum
  - name: specs
    kind: glob
    locator: openspec/changes/*/specs/**/*.md
    signature: checksum
  # Declared here because three later steps premise it and none of them can create it:
  # genai.implement ticks its boxes and may edit nothing else under `openspec/**`, genai.merge
  # leaves the ticked file in the working tree, and genai.archive counts the boxes still open
  # before folding. It was never declared, so the file existed only when this step happened to
  # scaffold the change with openspec's own command — and a round that wrote the directory by
  # hand carried all three past a file that was not there. Measured: one full round shipped with
  # no tasks.md anywhere, which turned the tick-the-boxes rule into a silent no-op and left the
  # archived record saying nothing about what was done.
  - name: tasks
    kind: glob
    locator: openspec/changes/*/tasks.md
    signature: checksum

# One entry rule, deliberately. Two mutually exclusive ones deadlock: neither can be satisfied
# without breaking the other, and there is no recovery path.
#
# `first_attempt` is what makes it survivable at all. This step flips the items it selects from
# `ready` to `active`, so after one pass the rule it entered under is false — and on `always` any
# rework would be refused forever, silently, because a ready refusal writes no event and spends no
# patience. This is a root node with no upstream, so "has never been dispatched" is the whole of
# what "fresh work arrived" can mean here; a step with an upstream that can re-run wants
# `upstream_reran` instead.
ready:
  - rule_id: has-ready-backlog
    when: first_attempt
    checker:
      type: command
      command: node .flow/genai/check.mjs backlog-status --status ready
      label_from: result
      values: [present, absent, unreadable]
    on_result:
      present: { ready: true }
      absent:
        ready: false
        reason: "No backlog item is in ready state, so there is nothing to design this round"
      unreadable:
        ready: false
        reason: "The requirements directory could not be read — confirm the sibling <project>_genai directory exists"
      failed:
        ready: false
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        ready: false
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # Checked here, at the front of the round, and nowhere in the implementation loop. Every step
  # downstream reads this map to know what the project is made of — which module a requirement lands
  # in, which side of a contract has another side, where a module's documentation lives — so
  # designing against a stale one produces a spec that is wrong in a way no later gate looks for.
  # Once per round is also all it is worth: the check forks make once per declared target, and
  # nothing inside a round renames a target.
  #
  # No `when: first_attempt`, unlike the rule above. That one is scoped because claiming an item
  # moves it out of `ready` and a second attempt would refuse on its own success. Nothing here
  # changes state, so re-entry should see a repair.
  - rule_id: modules-declared
    checker:
      type: command
      command: node .flow/genai/check.mjs modules-map
      timeout_ms: 120000
      label_from: result
      values: [consistent, map_missing, map_malformed, target_missing]
    on_result:
      consistent: { ready: true }
      map_missing:
        ready: false
        reason: "tools/genai/modules.json is not there, so no step knows how this repository is divided. Re-install with genai-init, or write it: one entry per module, `path` `.` for a project that is one module"
      map_malformed:
        ready: false
        reason: "tools/genai/modules.json does not satisfy its contract; the reason names the field. A freshly installed map declares no modules at all and reports this until genai-init's last phase fills it in"
      target_missing:
        ready: false
        reason: "The map names a Makefile target that make does not have. Either the target was renamed and the map was not, or the map names one that never existed — the facts say which module and which target. This is a person's one-line fix, not a round's"
      failed:
        ready: false
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        ready: false
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

# Rules run in declaration order and the first non-pass concludes, so the cheap prerequisites
# come first and the expensive ones last.
gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: "No change directory or spec delta landed. Every change needs at least proposal.md, tasks.md and a delta under specs/"

  - rule_id: no-spin
    checker: { type: signature_changed }
    on_result:
      satisfied: { verdict: pass }
      stalled:
        verdict: reject
        message: "This attempt is byte-identical to the last one. Nothing moved"

  - rule_id: outcome
    checker: { type: report, field: outcome }
    on_result:
      completed: { verdict: pass }
      partial:
        verdict: reject
        message: "A backlog item is still uncovered. Either cover it, or push it back to draft and say what is missing"
      failed:
        verdict: reject
        message: "Say where this got stuck"
      blocked:
        verdict: reject
        message: "Record what blocked it under deferred, with the reason"

  # The scenario ids, which nothing downstream can invent for itself: the e2e suite, its manifest
  # and its acceptance report all key on them, so a scenario without one is a scenario no later step
  # can address. openspec does not care — it checks that a requirement HAS scenarios, never that one
  # can be named — which is exactly why this rule is here and not left to `openspec-valid` below.
  #
  # Ahead of that rule because it only reads files, while validation spawns a process.
  - rule_id: scenarios
    checker:
      type: command
      command: node .flow/genai/check.mjs spec-scenarios
      timeout_ms: 120000
      label_from: result
      values: [unique, unnumbered, duplicated, count_mismatch, unreadable]
    on_result:
      unique: { verdict: pass }
      unnumbered:
        verdict: reject
        message: "A scenario carries no id. The gate facts name the headers — every scenario needs one, in the form the genai-openspec skill defines, because the e2e suite and its report have no other way to refer to it"
      duplicated:
        verdict: reject
        message: "An id appears twice inside one change. Ids are never reused: two assertions sharing one id read as the same assertion in the manifest, the test title and the report"
      count_mismatch:
        verdict: reject
        message: "openspec counts a different number of scenarios than this check found. That is a bug in the installed step definitions, not in the spec — the two readers have drifted apart and the facts show both numbers"
      unreadable:
        verdict: reject
        message: "openspec/changes/ could not be read. A setup problem, not a problem with the artifact"
      failed:
        verdict: reject
        message: "The check exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # openspec validate exits 0 even when items fail, so its exit code cannot be trusted on its
  # own — read the totals line instead. A gate that always passes is worse than no gate: it
  # reads as evidence.
  - rule_id: openspec-valid
    checker:
      type: command
      command: node .flow/genai/check.mjs openspec-valid --scope changes
      timeout_ms: 120000
      label_from: result
      values:
        - satisfied
        - validation_failed
        - totals_unreadable
        - openspec_unavailable
    on_result:
      satisfied: { verdict: pass }
      validation_failed:
        verdict: reject
        message: "openspec validation failed. The count and the tail of its output are in the gate facts — fix each reported problem"
      totals_unreadable:
        verdict: reject
        message: "openspec printed no totals line, so nothing was actually validated. Do not read that as a pass"
      openspec_unavailable:
        verdict: reject
        message: "The openspec command could not run. A gate-environment problem, not a problem with the artifact"
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # Claiming and producing must agree, in both directions. The first half — at least one item is
  # active — is what makes the whole round countable: the set of active items IS this round's
  # roster, so a round that claims nothing gives the closing steps nothing to check, and their
  # end-state gates would pass on an empty set.
  - rule_id: claimed
    checker:
      type: command
      command: node .flow/genai/check.mjs backlog-claimed
      label_from: result
      values: [agreed, unclaimed, none_active, unreadable]
    on_result:
      agreed: { verdict: pass }
      unclaimed:
        verdict: reject
        message: "A backlog item was moved to active but no change references it. The gate facts name which ones — claiming and producing must agree"
      none_active:
        verdict: reject
        message: "No backlog item is active, so this round claimed nothing. The set of active items is the round's roster, and the closing steps have nothing to approve without it"
      unreadable:
        verdict: reject
        message: "The requirements directory or openspec/changes/ could not be read. A setup problem, not a problem with the artifact"
      failed:
        verdict: reject
        message: "The check exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"
