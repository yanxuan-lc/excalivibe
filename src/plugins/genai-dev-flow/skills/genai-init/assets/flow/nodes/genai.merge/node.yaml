id: genai.merge
kind: effect
description: required - the only step that commits what the round produced. Every step before it deliberately leaves the specs, the review records and the ticked tasks.md in the working tree, because committing during a review invalidates the verdict that review is producing, so a graph without this step ends with the whole round uncommitted and nothing on the integration branch

executor:
  protocol: main

inputs:
  - name: reviews
    from: genai.code-review
    required: true
  - name: e2e-report
    from: genai.e2e
    required: true
  - name: commits
    from: genai.implement
    required: true
  # Declared here for the same reason genai.code-review declares it, and both ends are required: a
  # premise names inputs of the step it is written on, so `against: product` below is unresolvable
  # without this line, and `of: [reviews]` can only be answered if the review declared it too. This
  # step does not read it — its own subject is the whole branch, which `commits` already names.
  - name: product
    from: genai.implement
    required: true

outputs:
  - name: merged
    kind: git_commit
    locator: HEAD
    signature: commit_sha

ready:
  # of is whose conclusion; against is what that conclusion was about. Do not merge code that
  # moved after the review approved it.
  #
  # `absent` is ready here for the same reason it is in genai.implement — a round that left the
  # review out has no verdict to keep fresh — but the two are not the same decision, and a project
  # that wants the reading mandatory flips this one branch to `verdict: reject` without touching
  # anything else. That is the whole point of the label being routed rather than assumed: the
  # framework knows the fact, and each step says what the fact means for it.
  #
  # What is worth reading twice before flipping either: with genai.code-review and genai.e2e both
  # out of a graph, this step's own gates are all that stands between the round and the integration
  # branch, and both of them measure the project's own suite. Nothing independent of whoever wrote
  # the code has looked at it. That is a legitimate shape for a one-line fix and a bad one for
  # anything else, and the choice is visible where it is made: `fsx graph create` prints one notice
  # per premise that will fall to `absent`.
  #
  # **`against: product`, not `against: commits`, and the difference was measured.** A tip signature
  # says "some commit landed", and this flow lands commits the review's subject does not contain: a
  # delegation to genai.e2e-author repairs a test and commits it, the doc writer updates a document.
  # A round reached this step with the product code untouched since the approval, two such commits
  # against it, and the review invalidated by both. `genai.implement` declares `product` for this
  # reader alone, and `check.mjs signature-product` says what it covers.
  #
  # **`stale` delegates rather than refuses, and that is what makes the loop above terminate.** The
  # graph carries `merge -> code-review` on `delegate`, narrowed by this `rule_id` — without the
  # narrowing it would also catch the rule below and pull the acceptance run back by mistake. Sending
  # the work where it can actually be done costs no patience, and the chain closes itself: the review
  # re-runs against the current product code, its `pass` edge re-activates this step, and the premise
  # is fresh. Nobody updates a number anywhere; the framework compares the snapshot it took when it
  # dispatched the review against what is there now.
  #
  # The loop has a fixed point because genai.code-review does not move what it is compared against:
  # it writes `review.md` and leaves it uncommitted for this step to collect. Read that as the
  # condition it is — a step that moved its own subject would spin here until the patience ran out.
  - rule_id: review-still-valid
    checker:
      type: upstream_premise
      of: [reviews]
      against: product
    on_result:
      fresh:
        verdict: pass
      absent: { verdict: pass }
      stale:
        verdict: delegate
        message: "The product code moved after the review approved it. Review the current tip — what you approved before is still on record, and this is about what changed since"
      unread:
        verdict: reject
        reason: "The review on record never read the product code, so it cannot say which version it approved. That is a bug in the installed step definitions — genai.code-review has to declare `product` as its own input"
      unknown:
        verdict: reject
        reason: "The review step is in this graph but has not run yet. Let genai.code-review be dispatched and gated first"

  # The same rule for the acceptance run, and the leak it closes is the one this flow would otherwise
  # have twice: e2e green on commit X, a review fix lands as Y, Y merges on X's evidence. Note what
  # is NOT here — no commit written into the report and compared by hand. The framework already
  # measures both sides, so asking an executor to stamp its own artifact would only add a field it
  # could get wrong.
  #
  # **`against: commits` here, deliberately, where the rule above narrowed to `product`.** An
  # acceptance run executes the test code as well as the product, so a repaired test is exactly the
  # kind of change that makes a green run stop describing what would happen now. Narrowing this one
  # the same way would keep a pass that no longer covers the suite that produced it.
  #
  # `stale` delegates for the same reason it does above, over the graph's `merge -> e2e` edge, and
  # that edge needs this `rule_id` too — two rules on one node both returning `delegate` to different
  # destinations is the case `fsx graph create` reports as `graph_transfer_ambiguous`. The fixed
  # point holds here as well: genai.e2e writes `e2e-report.md` and leaves it uncommitted.
  - rule_id: e2e-still-valid
    checker:
      type: upstream_premise
      of: [e2e-report]
      against: commits
    on_result:
      fresh:
        verdict: pass
      # A graph with no acceptance run has no pass to invalidate. Note that genai.e2e and
      # genai.e2e-author leave together: the acceptance gate reads the manifest the author writes, so
      # an acceptance run with no author in the graph fails its own gate on an unreadable manifest
      # rather than arriving here.
      absent: { verdict: pass }
      stale:
        verdict: delegate
        message: "The branch moved after the acceptance run. A pass describes the commit it ran against and no other — run the e2e pass again on the current tip"
      unread:
        verdict: reject
        reason: "The acceptance run on record never read the commits, so it cannot say which tip it covered. That is a bug in the installed step definitions — genai.e2e has to declare `commits` as its own input"
      unknown:
        verdict: reject
        reason: "The acceptance step is in this graph but has not run yet. Let genai.e2e be dispatched and gated first"

  - rule_id: clean-tree
    checker:
      type: command
      command: node .flow/genai/check.mjs worktree
      label_from: result
      values: [clean, dirty, unreadable]
    on_result:
      clean: { verdict: pass }
      dirty:
        verdict: reject
        reason: "The working tree has uncommitted changes to tracked files. Commit or clean them before merging"
      unreadable:
        verdict: reject
        reason: "git could not run — confirm this is a repository"
      failed:
        verdict: reject
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: "There is no merge commit"

  - rule_id: outcome
    checker: { type: report, field: outcome }
    on_result:
      completed: { verdict: pass }
      partial:
        verdict: reject
        message: "The merge did not complete. Say where it stopped"
      failed:
        verdict: reject
        message: "The merge failed, most likely on a conflict. Resolve it and report again"
      blocked:
        verdict: reject
        message: "Say what blocked it"

  # The same atom genai.implement gates on, run once more on a different tree. That step left the
  # sprint branch green; this one runs after the merge, and only one thing happened in between —
  # so a failure here is the merge itself: a conflict resolved wrong, or two changes that are each
  # correct and wrong together. Nothing else in the round looks at the integration branch.
  #
  # Fix it here, on the integration branch. Going back to the sprint branch moves the tip that
  # genai.code-review approved, and `review-still-valid` above then refuses this step's next
  # entry — with the review already passed, nothing re-approves it.
  #
  # No signature_changed rule alongside it, for the reason the other end-state gates give: doing
  # nothing cannot turn a red tree green, so a delta check adds nothing, and it would make rework
  # fragile by draining the whole patience budget on one stalled attempt.
  - rule_id: checks
    checker:
      type: command
      command: node .flow/genai/check.mjs metrics
      timeout_ms: 600000
      label_from: result
      values:
        - satisfied
        - tests_failing
        - no_tests
        - too_many_skipped
        - coverage_below_floor
        - metrics_missing
        - metrics_unreadable
        - thresholds_missing
    on_result:
      satisfied: { verdict: pass }

      # Four ways the merge broke something that was working. All are fixed on this branch.
      tests_failing:
        verdict: reject
        message: "The merged tree is red, and the branch was green when it was reviewed. Fix it here on the integration branch — going back to the sprint branch strands this step behind a review that no longer matches"
      no_tests:
        verdict: reject
        message: "The suite reported no tests on the merged tree, though it ran on the branch. The merge either lost the tests or broke how they are found"
      too_many_skipped:
        verdict: reject
        message: "More than a tenth of the merged suite is skipped. A conflict settled by skipping a test is not a settled conflict"
      coverage_below_floor:
        verdict: reject
        message: "Coverage on the merged tree is below a floor this project declared. Dropping a test while resolving a conflict is the usual cause; the gate facts name the module and dimension"

      # Three ways the setup is broken. If the same target worked on the branch, the merge changed
      # it — and that is a scope problem, not something to fix by editing it again.
      metrics_missing:
        verdict: reject
        message: "`make genai-metrics` produced no `genai-metrics:` line on the integration branch. If it printed one on the sprint branch, the merge changed the target. Setup problem — stop and hand it to a person"
      metrics_unreadable:
        verdict: reject
        message: "The metrics line came through but does not satisfy the protocol; the gate facts say which field and what was found. Setup problem"
      thresholds_missing:
        verdict: reject
        message: "tools/genai/thresholds.json is missing or unreadable on the integration branch, so the gate has no floors to judge against. Setup problem"

      # The evaluator itself, which ships with these definitions.
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions, not in the merged code"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # The same gate genai.implement carries, measured again on the integration branch, and the reason
  # is the reason every gate here repeats: the branch was green and the merged tree is a tree nobody
  # has built. Two changes that each compile can fail to compile together, and in a repository of
  # several modules that is where a cross-language contract usually breaks — one side's branch and
  # the other side's branch, each internally consistent.
  - rule_id: build
    checker:
      type: command
      command: node .flow/genai/check.mjs build-ok
      timeout_ms: 900000
      label_from: result
      values: [built, build_failed, target_missing]
    on_result:
      built: { verdict: pass }
      build_failed:
        verdict: reject
        message: "The merged tree does not build, and each branch did. Fix it here on the integration branch — what make printed before it stopped is in the gate facts"
      target_missing:
        verdict: reject
        message: "Nothing on the integration branch proves the code compiles — no `genai-build` target, or one still holding its placeholder recipe, or one that runs no command. If the sprint branch built, the merge lost it. Setup problem — stop and hand it to a person"
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions, not in the merged code"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"
