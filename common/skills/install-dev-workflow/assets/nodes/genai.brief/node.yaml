id: genai.brief
kind: produce
executor:
  protocol: main

outputs:
  - name: brief
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/BRIEF.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the brief is not on disk
