id: genai.review-doc
kind: produce
executor: planner

inputs:
  - name: design
    from: genai.spec

outputs:
  - name: review
    kind: file
    locator: openspec/changes/{{vars.change}}/review.mdx
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: generated_from
      against: design
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the design has moved since this was generated - regenerate it rather than restamping it
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
        state:
          generated_from: "{{inputs.design}}"
      missing:
        verdict: reject
        message: the review document is not on disk
