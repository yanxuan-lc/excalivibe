id: genai.e2e-run
kind: verify
executor: e2e-runner

inputs:
  - name: code
    from: genai.implement
  - name: manifest
    from: genai.e2e-script
    required: false

outputs:
  - name: report
    kind: glob
    locator: openspec/changes/*/genai/e2e-report.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: ran_against
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: 代码自上次执行以来已变更，先前的验收结论已失效
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: 验收报告未落盘
  - rule_id: outcome
    checker:
      type: report
      field: outcome
    on_result:
      completed:
        verdict: pass
        state:
          ran_against: "{{inputs.code}}"
      partial:
        verdict: reject
        message: 部分场景未通过或未覆盖，按报告处理
      failed:
        verdict: reject
        message: 验收失败，按报告逐条处理
      blocked:
        verdict: delegate
        message: 应用起不来或环境不具备，不是实现能解决的
