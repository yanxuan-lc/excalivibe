id: genai.security
kind: verify
executor: security-runner

inputs:
  - name: code
    from: genai.implement

outputs:
  - name: report
    kind: glob
    locator: openspec/changes/*/genai/security-report.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: checked_code
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the code has changed since the security check ran, so the earlier conclusion no longer holds
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the security report is not on disk
  - rule_id: outcome
    checker:
      type: report
      field: outcome
    on_result:
      completed:
        verdict: pass
        state:
          checked_code: "{{inputs.code}}"
      partial:
        verdict: reject
        message: the security check completed only partly - resolve the open items in the report
      failed:
        verdict: reject
        message: the security check did not pass - work through the report
      blocked:
        verdict: delegate
        message: the tooling or environment is not available - not something the implementation can fix
