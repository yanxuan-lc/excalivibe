id: genai.e2e-script
kind: produce
executor: e2e-author

inputs:
  - name: specs
    from: genai.spec

outputs:
  - name: manifest
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/e2e-manifest.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the test manifest is not on disk
