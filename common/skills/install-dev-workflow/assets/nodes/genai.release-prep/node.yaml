id: genai.release-prep
kind: produce
executor: release-coordinator

outputs:
  - name: dossier
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/delivery.md
    signature: checksum

gates:
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the release dossier is not on disk
