id: genai.code-review
kind: judge
executor: code-reviewer

inputs:
  - name: code
    from: genai.implement

outputs:
  - name: checklist
    kind: glob
    locator: openspec/changes/*/genai/code-review.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: reviewed_code
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: 代码自上次评审以来已变更，先前结论已失效
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: 评审记录未落盘
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve:
        verdict: pass
        state:
          reviewed_code: "{{inputs.code}}"
      reject:
        verdict: reject
        message: 评审未通过，按记录中的发现逐条修改
      conditional:
        verdict: reject
        message: 有条件通过，先补齐标为阻塞的项
