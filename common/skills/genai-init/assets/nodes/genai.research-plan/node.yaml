id: genai.research-plan
kind: produce
executor:
  protocol: subagent
  params:
    name: researcher

inputs:
  - name: question
    from: genai.research-brief

outputs:
  - name: plan
    kind: file
    locator: docs/research/{{vars.topic}}/PLAN.md
    signature: checksum

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied: { verdict: pass }
      missing:
        verdict: reject
        message: the sub-questions are not on disk - unwritten, they cannot be reviewed before the answers arrive
