id: genai.code-review
kind: judge
executor:
  protocol: subagent
  params:
    name: code-reviewer

inputs:
  - name: code
    from: genai.implement

outputs:
  - name: checklist
    kind: file
    locator: openspec/changes/{{vars.change}}/genai/code-review.md
    signature: checksum

gates:
  - rule_id: still_valid
    checker:
      type: signature_match
      state_key: reviewed_code
      against: code
    on_result:
      matched:
        verdict: pass
      mismatched:
        verdict: reject
        message: the code has changed since it was reviewed, so the earlier conclusion no longer holds
  - rule_id: outputs
    checker:
      type: outputs_present
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: the review note is not on disk
  - rule_id: verdict
    checker:
      type: report
      field: verdict
    on_result:
      approve:
        verdict: pass
        state:
          reviewed_code: "{{inputs.code}}"
      reject:
        verdict: reject
        message: not approved - work through the findings in the note
      conditional:
        verdict: reject
        message: approved with conditions - clear the items marked blocking first
