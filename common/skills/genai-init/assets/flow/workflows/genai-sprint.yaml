# The whitelist of steps a genai-sprint graph may reference. Anything outside it is refused at
# graph creation, so "what can this kind of work do" has a definite answer.
nodes:
  - genai.spec
  - genai.spec-review
  - genai.write-arch-docs
  - genai.arch-decision
  - genai.implement
  - genai.e2e-author
  - genai.code-review
  - genai.e2e
  - genai.merge
  - genai.archive
  - genai.update-project-docs
  - genai.accept
  - genai.release

defaults:
  # Thirteen nodes, one value — so it is declared once here rather than thirteen times in the definitions.
  # This is a starting number to tune against real runs, not a derived one. Patience is shared
  # across the whole batch now that implement and review are not split per change, so a round
  # that reworks three changes once each spends three of it.
  #
  # One rework path deliberately spends none of it: a test bug found by genai.e2e is handed to
  # genai.e2e-author as a `delegate`, because the acceptance run did not fail — it worked, and what it
  # found was a broken test. What bounds that loop is the graph budget, not patience.
  patience: 5
