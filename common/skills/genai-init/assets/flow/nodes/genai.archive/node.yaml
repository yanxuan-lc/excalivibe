id: genai.archive
kind: produce
description: required while genai.accept is in the graph - the acceptance step refuses to start until openspec/changes/ is empty, and folding the deltas into the specs is what empties it

executor:
  protocol: main

inputs:
  - name: merged
    from: genai.merge
    required: true

outputs:
  - name: specs
    kind: glob
    locator: openspec/specs/**/*.md
    signature: checksum

# Both rules here are preconditions this step's own execution destroys, which is exactly what
# `when` exists for. On `always` neither could be declared at all: the archive empties the set of
# open changes and dirties the tree by folding, so the second attempt would be refused forever —
# and refused silently, since a ready refusal writes no event, spends no patience and records no
# attempt.
#
# `upstream_reran` rather than `first_attempt` because this step has an upstream that can re-run.
# The question is not "has this ever been dispatched" but "did fresh work arrive from the merge",
# and only the second one stays right if the merge produces another round of work.
#
# The corollary is a constraint on the graph: a `reject` edge from here back to `genai.merge` would
# re-activate this step through a dependency edge with the changes already folded, and these rules
# would then refuse it. The current graph has no such edge. Do not add one without revisiting this.
ready:
  - rule_id: has-changes-to-fold
    when: upstream_reran
    checker:
      type: command
      command: node .flow/genai/check.mjs open-changes
      label_from: result
      values: [present, absent, unreadable]
    on_result:
      present: { ready: true }
      absent:
        ready: false
        reason: "There is nothing open under openspec/changes/ to fold. Either this round produced no change, or something archived them already"
      unreadable:
        ready: false
        reason: "openspec/changes/ could not be read — confirm openspec/ exists in this repository"
      failed:
        ready: false
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        ready: false
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # The merge committed everything it touched, so the tree is clean when this step is first
  # reached. Anything uncommitted at that moment is work nobody accounted for, and folding on top
  # of it mixes it into the archive commit.
  - rule_id: clean-tree
    when: upstream_reran
    checker:
      type: command
      command: node .flow/genai/check.mjs worktree
      label_from: result
      values: [clean, dirty, unreadable]
    on_result:
      clean: { ready: true }
      dirty:
        ready: false
        reason: "The working tree has uncommitted changes to tracked files. The merge left it clean, so something happened after it — commit or clean it before folding"
      unreadable:
        ready: false
        reason: "git could not run — confirm this is a repository"
      failed:
        ready: false
        reason: "The check itself exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        ready: false
        reason: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

gates:
  - rule_id: outputs
    checker: { type: outputs_present }
    on_result:
      satisfied:
        verdict: pass
      missing:
        verdict: reject
        message: "No main spec landed under openspec/specs/. The deltas were never folded in"

  # No signature_changed rule here, deliberately. The gates below assert an absolute end state —
  # nothing open under openspec/changes/, and main specs that validate — which doing nothing
  # cannot satisfy, so there is no laziness left for a delta check to catch. And it would make
  # rework fragile: when the fold has already happened and a later rule refuses, the retry has
  # nothing to change, so `stalled` would drain the whole patience budget in one go.

  - rule_id: outcome
    checker: { type: report, field: outcome }
    on_result:
      completed:
        verdict: pass
      partial:
        verdict: reject
        message: "Some changes were not archived. Name them"
      failed:
        verdict: reject
        message: "Say what failed. A conflict between two changes folding into one capability is the usual cause"
      blocked:
        verdict: reject
        message: "Say what blocked it"

  # Nothing may be left behind: an unarchived change means its requirements never reached the
  # main spec, and the round would ship with the two out of step.
  - rule_id: no-open-changes
    checker:
      type: command
      command: node .flow/genai/check.mjs open-changes
      label_from: result
      values: [present, absent, unreadable]
    on_result:
      absent:
        verdict: pass
      present:
        verdict: reject
        message: "A change is still open under openspec/changes/, named in the gate facts. Archive every change of this round"
      unreadable:
        verdict: reject
        message: "openspec/changes/ could not be read. A setup problem, not a problem with the artifact"
      failed:
        verdict: reject
        message: "The check exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The check could not run at all. Re-install with genai-init, and confirm node is on PATH"

  # Same tool as the change validation upstream, one argument apart: openspec exits 0 even when
  # items fail, so the verdict comes from the totals line rather than the exit code.
  - rule_id: specs-valid
    checker:
      type: command
      command: node .flow/genai/check.mjs openspec-valid --scope specs
      timeout_ms: 120000
      label_from: result
      values:
        - satisfied
        - validation_failed
        - totals_unreadable
        - openspec_unavailable
    on_result:
      satisfied:
        verdict: pass
      validation_failed:
        verdict: reject
        message: "The folded main specs do not validate. Fix them in place, then re-run the archive"
      totals_unreadable:
        verdict: reject
        message: "openspec printed no totals line, so the main specs were never actually validated. Do not read that as a pass"
      openspec_unavailable:
        verdict: reject
        message: "The openspec command could not run. A gate-environment problem"
      failed:
        verdict: reject
        message: "The gate evaluator exited non-zero. That is a bug in the installed step definitions"
      unexecutable:
        verdict: reject
        message: "The gate evaluator could not run at all. Re-install with genai-init, and confirm node is on PATH"
